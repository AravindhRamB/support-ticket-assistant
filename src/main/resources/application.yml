spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/support_assistant?currentSchema=support
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    default-schema: support
    schemas: support

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  llm:
    provider: ${LLM_PROVIDER:mock}
    endpoint: ${LLM_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${LLM_MODEL:gpt-4.1-mini}
    api-key: ${LLM_API_KEY:}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:15000}
    max-attempts: ${LLM_MAX_ATTEMPTS:3}
